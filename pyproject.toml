[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitagent"
version = "0.1.0"
description = "Personal fitness companion in your terminal"
requires-python = ">=3.9"
dependencies = ["textual>=0.89,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.scripts]
fitagent = "fitagent.cli:main"

[tool.setuptools.packages.find]
include = ["fitagent*"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".opencode"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
